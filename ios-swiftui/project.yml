name: BJJChecklist
options:
  bundleIdPrefix: com.brothersfight
  deploymentTarget:
    iOS: 17.0
  developmentLanguage: pt-BR
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  BJJChecklist:
    type: application
    platform: iOS
    sources:
      - path: Sources/BJJChecklist
      - path: Sources/BJJChecklistApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.brothersfight.bjjchecklist
      DEVELOPMENT_TEAM: Q39UF8B7S5
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_FILE: Sources/BJJChecklistApp/Info.plist
      GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BJJChecklistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/BJJChecklistTests
    dependencies:
      - target: BJJChecklist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.brothersfight.bjjchecklist.tests
      GENERATE_INFOPLIST_FILE: YES
