<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
{{alternates}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Space+Mono:wght@400;700&family=Archivo:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{homeHref}}">{{brand}}</a>
    <nav class="site-nav" aria-label="{{navLabel}}">
      <a href="{{checklistHref}}">{{navChecklist}}</a>
      <a href="{{supportHref}}">{{navSupport}}</a>
      <a class="by" href="{{tatame0Url}}">{{byTatame0}}</a>
{{langSwitch}}
    </nav>
  </header>
  <main class="{{mainClass}}">
{{body}}
  </main>
  <footer class="site-footer">
    <p>{{footerLine}}</p>
    <nav aria-label="{{footerNavLabel}}">
      <a href="{{checklistHref}}">{{footerChecklist}}</a>
      <a href="{{privacyHref}}">{{footerPrivacy}}</a>
      <a href="{{supportHref}}">{{footerSupport}}</a>
      <a href="{{ownersUrl}}">{{footerOwners}}</a>
      <a href="{{tatame0Url}}">{{footerBy}}</a>
    </nav>
  </footer>
  <script src="/b.js" defer></script>
</body>
</html>
